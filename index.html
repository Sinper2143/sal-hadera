<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B5D4A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121512" media="(prefers-color-scheme: dark)">
<meta name="description" content="השוואת מחירי סופרמרקטים ב-19 סניפים בחדרה">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="סל חדרה">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html{color-scheme:light dark}
  body{margin:0; font:14px/1.5 system-ui,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
  /* מרווח לאזור הבטוח של אייפון כשהאפליקציה מותקנת */
  .wrap{padding-bottom:calc(80px + env(safe-area-inset-bottom))!important}
</style>
</head>
<body>
<title>סל חדרה</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{
  --ground:#F6F7F4; --surface:#FFFFFF;
  --ink:#161D19; --ink-2:#3C4740; --muted:#6B7770;
  --line:#DDE2D9; --line-2:#EDF0EA; --chip:#EFF2EC;
  --accent:#0B5D4A; --accent-soft:#E2EFE9;
  --cheap:#0F7355; --cheap-bg:#E4F2EA;
  --dear:#9C3B2B;  --dear-bg:#F8EBE7;
  --shadow:0 1px 2px rgba(22,29,25,.05), 0 10px 28px -20px rgba(22,29,25,.3);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121512; --surface:#1A1E1A;
    --ink:#E9EEE6; --ink-2:#C2CCBE; --muted:#8E9A8C;
    --line:#2C322B; --line-2:#242922; --chip:#232821;
    --accent:#56C39C; --accent-soft:#17302A;
    --cheap:#56C39C; --cheap-bg:#17302A;
    --dear:#E2886F;  --dear-bg:#31211C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#121512; --surface:#1A1E1A;
  --ink:#E9EEE6; --ink-2:#C2CCBE; --muted:#8E9A8C;
  --line:#2C322B; --line-2:#242922; --chip:#232821;
  --accent:#56C39C; --accent-soft:#17302A;
  --cheap:#56C39C; --cheap-bg:#17302A;
  --dear:#E2886F;  --dear-bg:#31211C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Assistant","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5; direction:rtl; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px; margin:0 auto; padding:20px 16px 60px}

header{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:16px}
h1{
  font-family:"Frank Ruhl Libre",Georgia,serif; font-weight:900; margin:0;
  font-size:clamp(25px,5vw,34px); line-height:1.05; letter-spacing:-.01em;
}
.sub{color:var(--muted); font-size:13px; margin-top:4px}
.themer{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:999px; padding:6px 13px; font:inherit; font-size:12.5px; cursor:pointer; white-space:nowrap;
}
.themer:hover{border-color:var(--accent); color:var(--accent)}

/* search */
.searchbar{position:relative; margin-bottom:10px}
#q{
  width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:11px; padding:14px 46px 14px 14px; font:inherit; font-size:17px; box-shadow:var(--shadow);
}
#q::placeholder{color:var(--muted); font-size:15px}
.searchbar::before{
  content:"⌕"; position:absolute; inset-inline-end:15px; top:50%; transform:translateY(-54%);
  color:var(--muted); font-size:21px; pointer-events:none;
}
.quick{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.quick button{
  border:1px solid var(--line); background:var(--chip); color:var(--ink-2);
  border-radius:999px; padding:6px 13px; font:inherit; font-size:13px; cursor:pointer;
}
.quick button:hover{border-color:var(--accent); color:var(--accent)}
.count{font-size:13px; color:var(--muted); margin-bottom:12px}

/* one product = one card holding every branch, cheapest first */
.cards{display:flex; flex-direction:column; gap:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.card > h2{
  font-family:"Frank Ruhl Libre",Georgia,serif; font-weight:700; font-size:18px;
  margin:0; padding:14px 16px 11px; line-height:1.3; text-wrap:balance;
}
.card .sumline{
  padding:0 16px 12px; margin-top:-4px; font-size:13px; color:var(--muted);
  display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline;
}
.card .sumline b{color:var(--cheap); font-weight:700; font-variant-numeric:tabular-nums}

table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
tbody tr{border-top:1px solid var(--line-2)}
tbody tr.best{background:var(--cheap-bg)}
tbody tr.worst{background:var(--dear-bg)}
td{padding:9px 16px; vertical-align:middle}
td.rank{width:30px; color:var(--muted); font-size:12.5px; padding-inline-end:0}
td.store{font-size:14.5px; color:var(--ink-2)}
tr.best td.store{font-weight:700; color:var(--ink)}
td.price{text-align:end; white-space:nowrap; font-weight:700; font-size:16px; width:92px}
tr.best  td.price{color:var(--cheap)}
tr.worst td.price{color:var(--dear)}
td.extra{text-align:end; white-space:nowrap; font-size:12.5px; color:var(--muted); width:78px; padding-inline-start:0}
tr.best td.extra{color:var(--cheap); font-weight:700}

.tagline{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em;
  padding:1px 7px; border-radius:999px; margin-inline-start:7px; vertical-align:1px;
}
tr.best  .tagline{background:var(--cheap); color:#fff}
tr.worst .tagline{background:var(--dear);  color:#fff}

.more{
  width:100%; border:0; border-top:1px solid var(--line-2); background:none;
  color:var(--accent); font:inherit; font-size:13px; font-weight:600;
  padding:10px; cursor:pointer;
}
.more:hover{background:var(--chip)}
.empty{text-align:center; color:var(--muted); padding:50px 20px; font-size:14px; line-height:1.7}
.foot{margin-top:30px; padding-top:14px; border-top:1px solid var(--line-2); font-size:12px; color:var(--muted); line-height:1.65}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:460px){
  td{padding:9px 12px}
  td.extra{display:none}
  .card > h2{font-size:17px; padding:13px 12px 10px}
  .card .sumline{padding:0 12px 11px}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>סל חדרה</h1>
      <div class="sub">מחירי <b id="nStores">0</b> סניפים · עודכן <b id="gen">—</b></div>
    </div>
    <button class="themer" id="themer" type="button">מצב תצוגה</button>
  </header>

  <div class="searchbar">
    <input id="q" type="search" placeholder="מה אתם מחפשים? קוטג׳, עוף, קולה…" autocomplete="off" enterkeyhint="search">
  </div>
  <div class="quick" id="quick"></div>
  <div class="count" id="count">טוען…</div>
  <div class="cards" id="cards"></div>

  <p class="foot">
    המחירים מגיעים מקבצי שקיפות המחירים שרשתות המזון מחויבות לפרסם בחוק, ומתעדכנים כל שעה.
    מוצג רק מה שנמכר בלפחות 8 סניפים, כדי שההשוואה תהיה הוגנת.
  </p>
</div>

<script>
const LSTH = "salHadera.theme.v1";
let DATA = null;
const TOP = 8;          // כמה מוצרים מציגים בבת אחת
const SHOW = 6;         // כמה סניפים גלויים בכל מוצר לפני "הצג הכל"
const openAll = new Set();

(function(){
  let t=null; try{ t=localStorage.getItem(LSTH);}catch(e){}
  if(t) document.documentElement.setAttribute("data-theme",t);
  document.getElementById("themer").addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const next=cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem(LSTH,next);}catch(e){}
  });
})();

const nis = n => n.toLocaleString("he-IL",{minimumFractionDigits:2,maximumFractionDigits:2}) + " ₪";

fetch("data.json").then(r=>r.json()).then(d=>{
  DATA=d;
  document.getElementById("nStores").textContent=d.stores.length;
  document.getElementById("gen").textContent=d.generated;
  buildQuick();
  render("");
}).catch(()=>{
  document.getElementById("count").textContent="לא הצלחתי לטעון את המחירים. נסו לרענן.";
});

const QUICK=["קוטג","חלב","גבינה","יוגורט","עוף","שניצל","קולה","מים","שמן","אורז","קפה","נייר טואלט","שמפו","כביסה"];
function buildQuick(){
  const host=document.getElementById("quick");
  QUICK.forEach(w=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=w;
    b.addEventListener("click",()=>{
      const q=document.getElementById("q"); q.value=w; render(w); q.blur();
      scrollTo({top:0,behavior:"smooth"});
    });
    host.appendChild(b);
  });
}
document.getElementById("q").addEventListener("input",e=>{ openAll.clear(); render(e.target.value); });

function render(term){
  if(!DATA) return;
  const t=(term||"").trim();
  const cards=document.getElementById("cards");
  const countEl=document.getElementById("count");
  let list;
  if(!t){
    list=DATA.items.slice(0,TOP);
    countEl.textContent="המוצרים שבהם הפער בין הסניפים הוא הגדול ביותר. חפשו למעלה כדי לראות מוצר מסוים.";
  }else{
    list=DATA.items.filter(it=>it.n.includes(t)).slice(0,TOP);
    const all=DATA.items.filter(it=>it.n.includes(t)).length;
    countEl.textContent = all
      ? `נמצאו ${all} מוצרים עבור "${t}"${all>TOP?`, מוצגים ${TOP} הראשונים`:""}`
      : `לא נמצא מוצר בשם "${t}"`;
  }
  cards.innerHTML="";
  if(!list.length){
    cards.innerHTML='<div class="empty">לא נמצא מוצר בשם הזה.<br>נסו מילה אחת בלבד, למשל <b>קוטג</b> במקום <b>קוטג\' 5 אחוז</b>.</div>';
    return;
  }
  const frag=document.createDocumentFragment();
  list.forEach(it=>frag.appendChild(cardFor(it)));
  cards.appendChild(frag);
}

function cardFor(it){
  // כל הסניפים שמוכרים את המוצר, מהזול ליקר. זו כל התצוגה.
  const rows = it.p.map((v,i)=>({price:v, store:DATA.stores[i].n}))
                   .filter(r=>r.price!=null)
                   .sort((a,b)=>a.price-b.price);
  const lo=rows[0].price, hi=rows[rows.length-1].price;
  const open = openAll.has(it.b);
  const shown = open ? rows : rows.slice(0, SHOW);

  const card=document.createElement("div");
  card.className="card";

  const h=document.createElement("h2");
  h.textContent=it.n;
  card.appendChild(h);

  const sum=document.createElement("div");
  sum.className="sumline";
  const save=hi-lo;
  sum.innerHTML = `<span>הכי זול ב<b>${rows[0].store}</b></span>` +
                  `<span>חוסך <b>${nis(save)}</b> לעומת היקר ביותר</span>` +
                  `<span>${rows.length} סניפים</span>`;
  card.appendChild(sum);

  const tbl=document.createElement("table");
  const tb=document.createElement("tbody");
  shown.forEach((r,i)=>{
    const tr=document.createElement("tr");
    const isBest = r.price===lo, isWorst = r.price===hi && !isBest;
    if(isBest) tr.className="best";
    else if(isWorst) tr.className="worst";
    const diff = r.price-lo;
    tr.innerHTML=
      `<td class="rank">${i+1}</td>` +
      `<td class="store"></td>` +
      `<td class="price">${nis(r.price)}</td>` +
      `<td class="extra">${isBest ? "הכי זול" : "+"+nis(diff)}</td>`;
    tr.querySelector(".store").textContent=r.store;
    if(isWorst){
      const tag=document.createElement("span");
      tag.className="tagline"; tag.textContent="הכי יקר";
      tr.querySelector(".store").appendChild(tag);
    }
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  card.appendChild(tbl);

  if(rows.length>SHOW){
    const btn=document.createElement("button");
    btn.className="more"; btn.type="button";
    btn.textContent = open ? "הצג פחות" : `הצג את כל ${rows.length} הסניפים`;
    btn.addEventListener("click",()=>{
      open ? openAll.delete(it.b) : openAll.add(it.b);
      render(document.getElementById("q").value);
    });
    card.appendChild(btn);
  }
  return card;
}
</script>

<div id="installBar" hidden style="
  position:fixed; inset-inline:12px; bottom:calc(12px + env(safe-area-inset-bottom));
  background:var(--surface); border:1px solid var(--accent); border-radius:12px;
  padding:12px 14px; display:flex; align-items:center; gap:12px; z-index:20;
  box-shadow:0 8px 32px -12px rgba(0,0,0,.4); max-width:520px; margin:0 auto;">
  <div style="flex:1; font-size:13.5px; line-height:1.4; color:var(--ink)">
    <b>להתקין את סל חדרה?</b><br>
    <span style="color:var(--muted)">תיפתח כאפליקציה, ותעבוד גם בלי אינטרנט.</span>
  </div>
  <button id="installYes" class="btn primary" type="button">התקן</button>
  <button id="installNo" class="btn" type="button" aria-label="לא עכשיו">✕</button>
</div>
<script>
// service worker: בלעדיו אין התקנה ואין עבודה אופליין.
if ("serviceWorker" in navigator) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err =>
      console.warn("רישום ה-service worker נכשל:", err));
  });
}
// שורת ההתקנה מוצגת רק כשהדפדפן באמת מציע להתקין, ומושתקת ל-30 יום אחרי סירוב.
(function(){
  const SNOOZE = "salHadera.installSnooze";
  let deferred = null;
  const bar = document.getElementById("installBar");
  const snoozed = () => {
    try { return Number(localStorage.getItem(SNOOZE) || 0) > Date.now(); }
    catch(e){ return false; }
  };
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferred = e;
    if (!snoozed()) bar.hidden = false;
  });
  document.getElementById("installYes").addEventListener("click", async () => {
    bar.hidden = true;
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
  });
  document.getElementById("installNo").addEventListener("click", () => {
    bar.hidden = true;
    try { localStorage.setItem(SNOOZE, String(Date.now() + 30*864e5)); } catch(e){}
  });
  addEventListener("appinstalled", () => { bar.hidden = true; });
})();
</script>
</body>
</html>
